services:
  platform:
    platform: linux/amd64
    image: stellar/anchor-platform:latest
    command: --sep-server --platform-server --event-processor --stellar-observer
    volumes:
      - ./config:/config
    env_file:
      - ./dev.env
      - ./.env.secrets
    ports:
      - "8082:8080"
      - "8086:8085"
    depends_on:
      - db
      - kafka
      - coridor-server

  coridor-server:
    build: ./coridor-server
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8091:8091"
    env_file:
      - ./dev.env
      - ./.env.secrets
    environment:
      PORT: 8091
      PLATFORM_API_URL: http://platform:8085
    volumes:
      - coridor-data:/app/data
    depends_on:
      - db

  kafka:
    platform: linux
    image: confluentinc/cp-kafka:7.4.3
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29096
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: ciWo7IWazngRchmPES6q5A==
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  db:
    image: postgres:15.2-alpine
    ports:
      - "5432:5432"
    env_file:
      - ./dev.env
      - ./.env.secrets
    environment:
      POSTGRES_USER: postgres
      # Must match SECRET_DATA_PASSWORD in dev.env (use: docker compose --env-file dev.env ...)
      POSTGRES_PASSWORD: ${SECRET_DATA_PASSWORD:-password}

volumes:
  coridor-data:

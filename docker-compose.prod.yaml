# Production override — bind services to localhost only (Nginx terminates TLS).
# IMPORTANT: use `!override` so ports from docker-compose.yaml are REPLACED, not merged.
# Without !override, Docker tries to bind 8091 twice (0.0.0.0 + 127.0.0.1) → "address already in use".

services:
  platform:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:8086:8085"

  coridor-server:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8091:8091"

  db:
    restart: unless-stopped
    ports: !override []

  kafka:
    restart: unless-stopped
    ports: !override []
